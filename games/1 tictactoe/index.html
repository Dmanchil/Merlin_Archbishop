<style>
*{box-sizing:border-box}
body{margin:0;padding:8px 12px;color:#eee;font:15px system-ui,sans-serif}
.game{position:relative;width:min(100%,300px);aspect-ratio:8/15;margin:auto;overflow:hidden;text-align:center;background:#171717}
h1{position:absolute;top:55%;left:0;width:100%;margin:0;font-size:18px;letter-spacing:1px;color:#eee}
.subtitle,.hint{position:absolute;left:0;width:100%;color:#aaa;font-size:13px}
.subtitle{top:61%;margin:0}
#status{position:absolute;top:66%;left:0;width:100%;min-height:22px;font-weight:600;color:#eee}
#board{position:absolute;top:0;left:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:53.333%;margin:0;background:#171717 url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGoAAABqAgMAAAApTywEAAAADFBMVEUXFxcfHx8lJSUqKioABJcJAAAAZ0lEQVR42mP4jxN8YHi1ChfYgFfuZSgOEDYqNyo3KjcqN/zlRIe1/0Tp7z8x+tknSn//idLPf6IQSMfwBFtIX/+J0tF/ovT0H9R39PMfNLnQxz6478i2L5A0t4jCraTAf+S2k/G0vQFJpE4xe8aWtgAAAABJRU5ErkJggg==") repeat;background-size:33.333% 33.333%}
.cell{width:100%;height:100%;min-width:0;min-height:0;padding:14%;border:0;background:transparent;color:#eee;font-size:72px;line-height:1}
.score{position:absolute;top:72%;left:6%;display:flex;width:88%;justify-content:space-around;margin:0;padding:8px 4px;border-radius:10px;background:rgba(0,0,0,.38);color:#eee}
.score div{display:flex;gap:7px;align-items:center}
.score b{color:var(--tg-theme-accent-text-color,var(--tg-theme-button-color,#6da9ff))}
#reset{position:absolute;top:82%;left:50%;transform:translateX(-50%);padding:9px 20px;border:0;border-radius:9px;background:var(--tg-theme-button-color,#3578e5);color:var(--tg-theme-button-text-color,#fff);font:600 14px system-ui,sans-serif}
.hint{top:91%;min-height:18px}
#board{height:300px;grid-template-rows:repeat(3,100px)}
.cell{height:100px;min-height:100px;border:0;background:transparent}
</style>
<main class="game">
  <h1>Крестики-нолики</h1>
  <p class="subtitle">Сыграй против компьютера</p>
  <div id="status" aria-live="polite"></div>
  <div id="board" aria-label="Игровое поле">
    <button class="cell" aria-label="Клетка 1"></button><button class="cell" aria-label="Клетка 2"></button><button class="cell" aria-label="Клетка 3"></button>
    <button class="cell" aria-label="Клетка 4"></button><button class="cell" aria-label="Клетка 5"></button><button class="cell" aria-label="Клетка 6"></button>
    <button class="cell" aria-label="Клетка 7"></button><button class="cell" aria-label="Клетка 8"></button><button class="cell" aria-label="Клетка 9"></button>
  </div>
  <div class="score"><div><b>X</b><span id="sx">0</span></div><div><b>O</b><span id="so">0</span></div><div><b>Ничья</b><span id="sd">0</span></div></div>
  <button id="reset">Новая игра</button>
  <div id="hint" class="hint"></div>
</main>
<script>
const DIFFICULTY=__TICTACTOE_DIFFICULTY__,TW=window.TelegramWidget,KEY='ttt-local-v1',lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],cells=[...document.querySelectorAll('.cell')],$=id=>document.getElementById(id);
let board=Array(9).fill(''),score=[0,0,0],finished=false,persist=!(TW&&(TW.isPreview||TW.isForward));
if(persist)try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.b)&&saved.b.length===9&&saved.b.every(v=>v===''||v==='X'||v==='O')&&Array.isArray(saved.s)&&saved.s.length===3&&saved.s.every(v=>Number.isInteger(v)&&v>=0)){board=saved.b;score=saved.s}}catch{persist=false}
function winner(b){for(const line of lines){const v=b[line[0]];if(v&&v===b[line[1]]&&v===b[line[2]])return v}return ''}
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify({b:board,s:score}))}catch{persist=false}}
function draw(){cells.forEach((cell,i)=>{const v=board[i];cell.textContent=v==='X'?'×':v==='O'?'○':'';cell.setAttribute('aria-label','Клетка '+(i+1)+(v?': '+(v==='X'?'крестик':'нолик'):' пустая'))});['sx','so','sd'].forEach((id,i)=>$(id).textContent=score[i]);const w=winner(board);finished=!!w||board.every(Boolean);$('status').textContent=w?(w==='X'?'Ты выиграл!':'Компьютер выиграл!'):finished?'Ничья!':'Твой ход — X'}
function tactical(mark){for(let i=0;i<9;i++)if(!board[i]){board[i]=mark;const wins=winner(board)===mark;board[i]='';if(wins)return i}return -1}
function randomMove(){const available=board.map((v,i)=>v?'':i).filter(i=>i!=='');return available[Math.floor(Math.random()*available.length)]??-1}
function minimax(state,maximizing){const w=winner(state);if(w==='O')return 10;if(w==='X')return -10;if(state.every(Boolean))return 0;let best=maximizing?-Infinity:Infinity;for(let i=0;i<9;i++)if(!state[i]){state[i]=maximizing?'O':'X';const value=minimax(state,!maximizing);state[i]='';best=maximizing?Math.max(best,value):Math.min(best,value)}return best}
function bestMove(){let best=-Infinity,choices=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';const value=minimax(board,false);board[i]='';if(value>best){best=value;choices=[i]}else if(value===best)choices.push(i)}return choices[Math.floor(Math.random()*choices.length)]??-1}
function computer(){const i=Math.random()<DIFFICULTY?bestMove():randomMove();if(i>=0)board[i]='O'}
function move(i){if(finished||board[i])return;board[i]='X';if(!winner(board)&&!board.every(Boolean))computer();const w=winner(board);if(w)score[w==='X'?0:1]++;else if(board.every(Boolean))score[2]++;save();draw()}
cells.forEach((cell,i)=>cell.onclick=()=>move(i));
$('reset').onclick=()=>{board=Array(9).fill('');save();draw()};
draw();
if(TW&&TW.ready)TW.ready();
</script>
